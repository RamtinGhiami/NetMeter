name: netmeter
description: "NetMeter: home network usage monitor for Huawei 5G CPE routers"
publish_to: 'none'
version: 0.4.1+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  window_manager: 0.4.3
  tray_manager: 0.2.4
  launch_at_startup: ^0.5.1
  crypto: ^3.0.8
  ffi: ^2.2.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.ico
    - assets/dashboard.html
    - assets/icon.png
